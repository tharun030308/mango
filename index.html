<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PassItOn: from your surplus to someone's essential</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
  /* Stitch design tokens (light) as RGB channels so Tailwind opacity modifiers work */
  :root{
    color-scheme:light;
    --surface:248 252 225; --card:255 255 255; --low:242 246 220; --mid:236 240 214; --high:231 235 209; --highest:225 229 203;
    --ink:25 29 13; --sub:81 68 56; --line:131 116 103;
    --primary:132 84 20; --onprimary:255 255 255; --pfix:255 220 187; --onpfix:44 23 0;
    --sec:99 96 50; --onsec:255 255 255; --sfix:234 229 170; --onsfix:30 28 0;
    --ter:170 52 52; --onter:255 255 255; --tfix:255 218 215; --ontfix:65 0 5;
    --errc:255 218 214; --onerrc:147 0 10; --inv:46 50 33; --oninv:239 243 217;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --surface:24 27 15; --card:33 37 23; --low:39 43 28; --mid:46 50 35; --high:55 59 43; --highest:65 69 52;
      --ink:226 230 205; --sub:214 195 179; --line:155 143 128;
      --primary:251 186 114; --onprimary:70 41 0; --pfix:103 61 0; --onpfix:255 220 187;
      --sec:205 201 144; --onsec:50 48 0; --sfix:75 72 28; --onsfix:234 229 170;
      --ter:255 179 174; --onter:105 0 12; --tfix:137 28 31; --ontfix:255 218 215;
      --errc:147 0 10; --onerrc:255 218 214; --inv:226 230 205; --oninv:46 50 33;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface:24 2
    7 15; --card:33 37 23; --low:39 43 28; --mid:46 50 35; --high:55 59 43; --highest:65 69 52;
    --ink:226 230 205; --sub:214 195 179; --line:155 143 128;
    --primary:251 186 114; --onprimary:70 41 0; --pfix:103 61 0; --onpfix:255 220 187;
    --sec:205 201 144; --onsec:50 48 0; --sfix:75 72 28; --onsfix:234 229 170;
    --ter:255 179 174; --onter:105 0 12; --tfix:137 28 31; --ontfix:255 218 215;
    --errc:147 0 10; --onerrc:255 218 214; --inv:226 230 205; --oninv:46 50 33;
  }
  html{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:rgb(var(--high));color:rgb(var(--ink));font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-size:24px}
  .lbl{font-size:11px;font-weight:800;letter-spacing:.04em;color:rgb(var(--sub));display:block;margin-bottom:6px}
  ::-webkit-scrollbar{display:none}
  button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:2px solid rgb(var(--primary));outline-offset:2px}
  @media (prefers-reduced-motion: reduce){.animate-ping,.animate-pulse{animation:none!important}}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const rgb = n => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = { theme: { extend: {
    colors: Object.fromEntries(['surface','card','low','mid','high','highest','ink','sub','line','primary','onprimary','pfix','onpfix','sec','onsec','sfix','onsfix','ter','onter','tfix','ontfix','errc','onerrc','inv','oninv'].map(n=>[n,rgb(n)])),
    fontFamily: { sans: ['Plus Jakarta Sans','system-ui','sans-serif'] }
  } } };
</script>
</head>
<body class="font-sans antialiased">
<div id="app" class="mx-auto w-full max-w-[430px] min-h-[100dvh] flex flex-col bg-surface relative sm:shadow-xl">
  <header id="hdr" class="sticky top-0 z-40 bg-surface/95 backdrop-blur border-b border-line/10"></header>
  <main id="screen" class="flex-1 px-4 pt-4 pb-8"></main>
  <div id="bar" class="sticky bottom-0 z-40"></div>
  <div class="fixed inset-x-0 bottom-24 z-50 flex justify-center pointer-events-none px-4">
    <div id="toast" role="status" aria-live="polite" class="opacity-0 translate-y-4 transition duration-300 bg-inv text-oninv rounded-2xl shadow-xl px-4 py-3 text-sm font-semibold max-w-[380px] flex items-center gap-2.5">
      <span class="material-symbols-outlined text-[20px]">task_alt</span><span class="msg"></span>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const MIN = 60000, HR = 3600000, now = () => Date.now(), pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const timeToMs = v => { const [h, m] = v.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); if (d.getTime() > now()) d.setDate(d.getDate() - 1); return d.getTime(); };
const fmtCd = ms => { if (ms <= 0) return 'Expired'; const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h > 0 ? `${h}h ${pad(m)}m` : `${m}m ${pad(s%60)}s`; };
const fmtShort = ms => { if (ms <= 0) return '0m'; const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h > 0 ? `${h}h${pad(m)}` : (m > 0 ? `${m}m` : `${s}s`); };
const ic = (n, c = '', f = false) => `<span class="material-symbols-outlined ${c}"${f ? ` style="font-variation-settings:'FILL' 1"` : ''}>${n}</span>`;
const card = 'bg-card rounded-2xl p-4 shadow-sm border border-line/10';

/* ============ data ============ */
const CATS = {
  food:   {label:'Cooked food', icon:'ramen_dining', unit:'meals', blurb:'Surplus meals, catering batches, bakery items', urgent:true},
  clothes:{label:'Clothes', icon:'apparel', unit:'items', blurb:'Clean shirts, jackets, winter wear'},
  shoes:  {label:'Shoes', icon:'footprint', unit:'pairs', blurb:'School shoes, sneakers, sandals'},
  books:  {label:'Books & stationery', icon:'menu_book', unit:'items', blurb:'Textbooks, storybooks, notebooks'},
  other:  {label:'Other essentials', icon:'inventory_2', unit:'items', blurb:'Groceries, blankets, hygiene kits'}
};
/* Assumption: safe hours after cooking. Placeholder values, validate against food-safety guidance before a real pilot. */
const FOODS = {'Biryani & rice':4, 'Dal, curry & gravies':3, 'Bakery & bread':8, 'Sweets & dry snacks':12};
const ICON_F = {'Biryani & rice':'rice_bowl', 'Dal, curry & gravies':'dinner_dining', 'Bakery & bread':'bakery_dining', 'Sweets & dry snacks':'cookie'};
const DONORS = {biz:{name:'Aarav Caterers', area:'Andheri West', icon:'storefront', label:'Business'}, fam:{name:"Meera's Family", area:'Lokhandwala', icon:'home', label:'Family'}};
const SKILLS = {driving:['Driving / two-wheeler','two_wheeler'], cooking:['Food prep & cooking','restaurant'], packing:['Inventory & packing','inventory_2'], lifting:['Heavy lifting','fitness_center'], teaching:['Teaching / mentoring','school'], firstaid:['First aid certified','medical_services']};
const CAUSES = {food:['Food rescue & distribution','rice_bowl'], env:['Environment','eco'], child:['Child welfare & education','child_care'], elderly:['Elderly care','elderly'], emergency:['Emergency relief','emergency']};
const DAYS = ['M','T','W','T','F','S','S'];
const NGOS = [
  {id:'asha', name:'Asha Shelter', area:'Andheri East', km:1.4, kind:'Night shelter & community dining', icon:'night_shelter', cap:100,
   about:'A 60-bed night shelter with an evening community kitchen for daily-wage workers, seniors and youth. Runs on surplus food and volunteer couriers.',
   stats:[['120','meals served nightly'],['34','active volunteers'],['4.9★','volunteer rating']],
   skills:['driving','cooking','packing'], causes:['food'], avail:['1-5','1-6'], child:false,
   slots:[{id:'a1',label:'Saturday, 6:30–8:30 PM',role:'Hot-meal courier run',need:1,urgent:true},{id:'a2',label:'Sunday, 6:30–8:30 PM',role:'Hot-meal courier run',need:2},{id:'a3',label:'Next Saturday, 6:30–8:30 PM',role:'Dinner serving & kitchen handover',need:3}]},
  {id:'hope', name:'Hope Learning Centre', area:'Jogeshwari West', km:2.6, kind:'After-school learning centre', icon:'school', accepts:['shoes','books','clothes'],
   about:'Free after-school classes for 120+ children. Volunteers sort donated books, school kits and footwear before each term.',
   stats:[['120','children enrolled'],['18','active volunteers'],['4.8★','volunteer rating']],
   skills:['packing','teaching','lifting'], causes:['child'], avail:['0-5','0-6'], child:true,
   slots:[{id:'h1',label:'Saturday, 9:00 AM–12:00 PM',role:'Kit sorting & packing',need:4},{id:'h2',label:'Sunday, 9:00 AM–12:00 PM',role:'Footwear fitting & handover',need:2}]},
  {id:'sun', name:'Sunrise Roti Bank', area:'Versova', km:3.8, kind:'Community kitchen & bread distribution', icon:'bakery_dining', accepts:['food'],
   about:'Sunday-morning bread and meal distribution to coastal settlements, fed by bakeries and caterers.',
   stats:[['300','meals every Sunday'],['22','active volunteers'],['4.7★','volunteer rating']],
   skills:['cooking','packing','driving'], causes:['food'], avail:['0-6','1-5'], child:false,
   slots:[{id:'s1',label:'Sunday, 6:00–9:00 AM',role:'Cooking assistance',need:3},{id:'s2',label:'Saturday, 6:00–8:00 PM',role:'Bread pickup run',need:1}]},
  {id:'green', name:'GreenLine Cleanup Collective', area:'Versova Beach', km:4.6, kind:'Neighbourhood cleanup & recycling', icon:'eco', accepts:['clothes','other'],
   about:'Weekend beach and drain cleanups plus a recycling drop point. Needs hands and vehicles to haul collected waste.',
   stats:[['1.2 t','waste hauled monthly'],['40','active volunteers'],['4.6★','volunteer rating']],
   skills:['lifting','driving'], causes:['env'], avail:['0-5','0-6'], child:false,
   slots:[{id:'g1',label:'Saturday, 7:00–10:00 AM',role:'Cleanup crew',need:8},{id:'g2',label:'Sunday, 7:00–10:00 AM',role:'Hauling & drop-off',need:2}]},
  {id:'silver', name:'Silver Years Care', area:'Bandra West', km:7.5, kind:'Day-care for seniors', icon:'elderly', accepts:['clothes','other','food'],
   about:'A day-care centre for seniors who live alone. Volunteers keep company, help with meals and log basic health checks.',
   stats:[['45','seniors served'],['12','active volunteers'],['4.9★','volunteer rating']],
   skills:['firstaid','teaching','packing'], causes:['elderly','emergency'], avail:['0-0','0-1','0-2','0-3','0-4','1-5'], child:false,
   slots:[{id:'v1',label:'Weekdays, 9:00 AM–12:00 PM',role:'Companionship & meal help',need:3}]}
];
const NGO = id => NGOS.find(n => n.id === id);
const ASHA_BASE_USED = 20;

function seed() {
  const t = now();
  const food = (id, donor, area, km, ftype, qty, title, desc, agoMin) => ({id, cat:'food', donor, area, km, ftype, qty, unit:'meals', title, desc, cookedAt:t-agoMin*MIN, safeUntil:t-agoMin*MIN+FOODS[ftype]*HR, status:'posted', created:t-25*MIN});
  const item = (id, cat, donor, area, km, qty, title, desc, cond, pickup) => ({id, cat, donor, area, km, qty, unit:CATS[cat].unit, title, desc, cond, pickup, status:'posted', created:t-3*HR});
  return [
    food('d1','Aarav Caterers','Andheri West',1.8,'Biryani & rice',40,'40 biryani meal boxes','Veg and non-veg packed separately in insulated foil boxes.',132),
    food('d2','Spice Route Banquet','Andheri West',0.9,'Dal, curry & gravies',25,'25 dal & rice pouches','Hot sealed pouches, curbside ready.',152),
    food('d3','Artisan Bakers Bandra','Bandra West',2.4,'Bakery & bread',35,'35 loaves and buns','Sourdough, sandwich loaves and dinner rolls, individually bagged.',345),
    item('d4','shoes',"Meera's Family",'Lokhandwala',3.1,3,'3 pairs of school shoes','Black polished lace-ups, sizes 5–7. Sanitized and boxed.','Good','By Sunday'),
    item('d5','books','St. Jude Alumni Group','Khar',4.0,45,'45 science workbooks','Grade 6–8 workbooks, ready in 2 carry boxes.','Good','By Tuesday'),
    {id:'d0', cat:'food', donor:'Aarav Caterers', area:'Andheri West', km:1.8, ftype:'Biryani & rice', qty:30, unit:'meals', title:'30 veg pulao meals', desc:'Delivered last night.', cookedAt:t-26*HR, safeUntil:t-22*HR, status:'received', created:t-26*HR, claimedAt:t-25.5*HR, pickedAt:t-25*HR, receivedAt:t-24.6*HR, ngo:'Asha Shelter', method:'volunteer', vol:'Ravi K.'}
  ];
}

let S;
function init() {
  S = {role:'donor', screen:'give', p:{}, hist:[], persona:'biz', donations:seed(), nextId:10, form:null, claimEnd:0, feedTab:'urgent',
    needs:{meals:50, diet:'Veg + Halal', urgent:true, accepts:{food:true, shoes:true, books:true, clothes:false, other:false}, sizes:[5,6,7]},
    vol:{skills:new Set(['driving','cooking','packing']), causes:new Set(['food','env']), avail:new Set(['0-5','0-6','1-5','1-6']), radius:5},
    sort:'match', offers:{}, slotSel:{}, declined:new Set(), proof:{},
    impact:{given:2140, hot:1680, ngos:38, week:[180,220,240,310,390,460,340]}};
}
const find = id => S.donations.find(d => d.id === id);
const accepts = (n, cat) => n.id === 'asha' ? !!S.needs.accepts[cat] : n.accepts.includes(cat);
const usedCap = () => ASHA_BASE_USED + S.donations.filter(d => d.cat === 'food' && d.ngo === 'Asha Shelter' && d.claimedAt > now() - 12*HR).reduce((a, d) => a + d.qty, 0);
const dIcon = d => d.cat === 'food' ? ICON_F[d.ftype] : CATS[d.cat].icon;

/* ============ small components ============ */
const ST = {posted:['Waiting for an NGO','bg-sfix text-onsfix'], claimed:['Claimed','bg-pfix text-onpfix'], pickup:['In transit','bg-pfix text-onpfix'], received:['Received','bg-primary text-onprimary']};
const pill = s => `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${ST[s][1]}">${ST[s][0]}</span>`;
const chip = (on, label, click, icon) => `<button type="button" onclick="${click}" aria-pressed="${on}" class="px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition active:scale-95 ${on ? 'bg-primary text-onprimary' : 'bg-low text-ink hover:bg-mid'}">${icon ? ic(icon, 'text-[16px]') : ''}${label}${on ? ic('check', 'text-[14px]') : ''}</button>`;
const ring = (until, total, size = 56) => `<div class="rg relative shrink-0" data-until="${until}" data-total="${total}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 36 36" class="w-full h-full -rotate-90"><circle cx="18" cy="18" r="15" fill="none" stroke-width="3.5" class="stroke-high"/><circle class="arc stroke-primary" cx="18" cy="18" r="15" fill="none" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100"/></svg><div class="rgt absolute inset-0 flex items-center justify-center text-[10px] font-extrabold"></div></div>`;
const matchRing = pct => `<div class="relative shrink-0 w-14 h-14"><svg viewBox="0 0 36 36" class="w-full h-full -rotate-90"><circle cx="18" cy="18" r="15" fill="none" stroke-width="3.5" class="stroke-high"/><circle cx="18" cy="18" r="15" fill="none" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="${pct} 100" class="${pct >= 80 ? 'stroke-primary' : pct >= 55 ? 'stroke-sec' : 'stroke-line'}"/></svg><div class="absolute inset-0 flex items-center justify-center text-[13px] font-extrabold">${pct}<span class="text-[9px]">%</span></div></div>`;
const stepper = (id, val, unit, dec, inc) => `<div class="flex items-center justify-between bg-low rounded-2xl p-3"><button type="button" aria-label="Decrease" onclick="${dec}" class="w-12 h-12 rounded-xl bg-card shadow-sm flex items-center justify-center active:scale-95">${ic('remove')}</button><div class="text-center"><div id="${id}" class="text-[34px] leading-none font-extrabold text-primary tracking-tight">${val}</div><div class="text-[11px] font-bold text-sub mt-1">${unit}</div></div><button type="button" aria-label="Increase" onclick="${inc}" class="w-12 h-12 rounded-xl bg-card shadow-sm flex items-center justify-center active:scale-95">${ic('add')}</button></div>`;
const backRow = (title, right = '') => `<div class="flex items-center justify-between -mt-1 mb-1"><div class="flex items-center gap-1"><button type="button" aria-label="Back" onclick="A.back()" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center hover:bg-high">${ic('arrow_back')}</button><h2 class="font-bold text-lg">${title}</h2></div>${right}</div>`;
const empty = (icon, title, body, action = '') => `<div class="${card} text-center py-8 space-y-2"><div class="w-14 h-14 mx-auto rounded-full bg-pfix text-primary flex items-center justify-center">${ic(icon, 'text-[28px]')}</div><div class="font-bold">${title}</div><p class="text-sm text-sub max-w-[260px] mx-auto">${body}</p>${action}</div>`;
const proofBox = id => `<div class="flex items-center gap-3">${S.proof[id] ? `<img alt="Proof photo" src="${S.proof[id]}" class="w-16 h-16 rounded-xl object-cover">` : ''}<label class="flex-1 h-12 rounded-xl bg-low text-primary font-bold text-sm flex items-center justify-center gap-2 cursor-pointer">${ic('photo_camera', 'text-[20px]')}${S.proof[id] ? 'Retake proof photo' : 'Add proof photo (recommended)'}<input type="file" accept="image/*" capture="environment" class="hidden" onchange="A.proof('${id}',this)"></label></div>`;
const btn = (label, click, style = 'p', extra = '') => `<button type="button" onclick="${click}" class="w-full h-[52px] rounded-xl font-bold text-[15px] flex items-center justify-center gap-2 active:scale-[.98] transition ${style === 'p' ? 'bg-primary text-onprimary shadow-md' : style === 's' ? 'bg-low text-ink hover:bg-mid' : 'bg-ter text-onter shadow-md'} ${extra}">${label}</button>`;

/* ============ header & bar ============ */
function renderHeader() {
  const roles = [['donor','Donor'],['ngo','NGO'],['volunteer','Volunteer']];
  $('#hdr').innerHTML = `
  <button type="button" onclick="A.tab('impact')" class="w-full flex items-center justify-between gap-2 px-4 py-1.5 bg-low text-[11px] font-bold text-sub">
    <span class="flex items-center gap-2 min-w-0"><span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-60"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-primary"></span></span><span class="truncate">${S.impact.given.toLocaleString()} items and meals given · ${S.impact.ngos} active NGOs</span></span>
    <span class="text-primary flex items-center shrink-0">See impact${ic('chevron_right', 'text-[14px]')}</span></button>
  <div class="px-4 pt-2.5 pb-2 flex items-center gap-2.5">
    <div class="w-9 h-9 rounded-xl bg-primary text-onprimary flex items-center justify-center">${ic('volunteer_activism', 'text-[20px]', true)}</div>
    <div class="leading-tight"><div class="font-extrabold text-[17px] tracking-tight">PassItOn</div><div class="text-[11px] font-semibold text-sub">From your surplus to someone's essential</div></div>
  </div>
  <div class="px-4 pb-2.5"><div class="grid grid-cols-3 bg-high p-1 rounded-full">${roles.map(([k, l]) => `<button type="button" onclick="A.setRole('${k}')" aria-pressed="${S.role === k}" class="py-1.5 rounded-full text-xs font-bold flex items-center justify-center gap-1 transition ${S.role === k ? 'bg-card text-primary shadow-sm' : 'text-sub'}">${l}${k === 'volunteer' ? '<span class="text-[9px] px-1 py-px rounded-full bg-sfix text-onsfix font-extrabold">BETA</span>' : ''}</button>`).join('')}</div></div>`;
}
const NAV = {
  donor:[['give','add_circle','Give'],['activity','local_shipping','Activity'],['impact','insights','Impact']],
  ngo:[['feed','inbox','Feed'],['active','task_alt','Active'],['needs','checklist','Needs'],['impact','insights','Impact']],
  volunteer:[['dispatch','two_wheeler','Dispatch'],['matches','handshake','Matches'],['profile','tune','Profile'],['impact','insights','Impact']]
};
const NAVMAP = {dtl:'activity', ngod:'matches'};
const cta = inner => `<div class="bg-surface/95 backdrop-blur border-t border-line/10 px-4 pt-3 pb-4 space-y-2">${inner}</div>`;
function badgeFor(k) {
  if (S.role === 'ngo' && k === 'feed') return S.donations.filter(d => d.status === 'posted' && S.needs.accepts[d.cat] && (d.cat !== 'food' || d.safeUntil > now())).length;
  if (S.role === 'ngo' && k === 'active') return S.donations.filter(d => d.ngo === 'Asha Shelter' && d.status !== 'received').length;
  if (S.role === 'volunteer' && k === 'dispatch') return S.donations.filter(d => d.status === 'claimed' && d.method === 'volunteer' && !S.declined.has(d.id)).length;
  return 0;
}
function renderBar() {
  const s = S.screen; let h = '';
  if (s === 'form') {
    const f = S.form, bad = f.cat === 'food' && f.cookedAt + FOODS[f.ftype]*HR <= now();
    h = cta(`<button type="button" onclick="A.post()" ${bad ? 'disabled' : ''} class="w-full h-[52px] rounded-xl font-bold text-[15px] flex items-center justify-center gap-2 ${bad ? 'bg-high text-sub' : 'bg-primary text-onprimary shadow-md active:scale-[.98]'}">${bad ? 'Past safe window: cannot post' : (f.cat === 'food' ? 'Post food for urgent match' : 'Post donation')}${bad ? '' : ic('arrow_forward', 'text-[20px]')}</button><p class="text-center text-xs text-sub">NGOs that accept ${CATS[f.cat].label.toLowerCase()} are notified instantly</p>`);
  } else if (s === 'claim') {
    const d = find(S.p.id), food = d && d.cat === 'food';
    h = cta(`${btn(`${ic('local_shipping', 'text-[20px]')}Confirm claim${food ? ' (<span class="ct">10:00</span>)' : ''}`, 'A.confirmClaim()')}<button type="button" onclick="A.release()" class="w-full text-center text-sm font-bold text-ter py-1">Release to the next shelter</button>`);
  } else if (s === 'ngod') {
    const n = NGO(S.p.id), sid = S.slotSel[n.id] || n.slots[0].id, sl = n.slots.find(x => x.id === sid), on = S.offers[n.id];
    h = cta(`${btn(on ? `${ic('check_circle', 'text-[20px]')}Offer sent · tap to withdraw` : `Offer to help · ${sl.label.split(',')[0]}`, `A.offer('${n.id}')`, on ? 's' : 'p')}<p class="text-center text-xs text-sub">No lock-in. You can withdraw any time.</p>`);
  } else {
    const cur = NAVMAP[s] || s;

function score(n) {
  const p = S.vol, sk = n.skills.filter(x => p.skills.has(x)), ca = n.causes.filter(x => p.causes.has(x)), av = n.avail.filter(x => p.avail.has(x));
  const s = 35*sk.length/n.skills.length + 30*ca.length/n.causes.length + 25*av.length/n.avail.length + 10*Math.max(0, 1 - n.km/p.radius);
  return {n, pct:Math.min(99, Math.round(s)), sk, ca, av};
}

function toast(msg) { const el = $('#toast'); el.querySelector('.msg').textContent = msg; el.classList.remove('opacity-0', 'translate-y-4'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('opacity-0', 'translate-y-4'), 3200); }
function render() { renderHeader(); $('#screen').innerHTML = V[S.screen](); renderBar(); tick(); }
A.go = (screen, p = {}, push = true) => { if (push) S.hist.push({screen:S.screen, p:S.p}); S.screen = screen; S.p = p; render(); window.scrollTo(0, 0); };
A.back = () => { const h = S.hist.pop(); if (h) { S.screen = h.screen; S.p = h.p; } else { S.screen = HOME[S.role]; S.p = {}; } S.claimEnd = 0; render(); window.scrollTo(0, 0); };
A.tab = k => { S.hist = []; S.claimEnd = 0; A.go(k, {}, false); };
A.setRole = r => { S.role = r; S.hist = []; S.claimEnd = 0; A.go(HOME[r], {}, false); };
A.persona = k => { S.persona = k; render(); };
A.open = id => A.go('dtl', {id});
/* donor form */
A.openForm = cat => {
  const food = cat === 'food';
  S.form = {cat, ftype:'Biryani & rice', qty:food ? 20 : (cat === 'shoes' ? 2 : 5), cookedAt:Math.floor((now() - 30*MIN) / MIN) * MIN, cond:'Good', pickup:'By Sunday', desc:'', photo:null};
  A.go('form');
};
A.qty = d => { const f = S.form; f.qty = Math.max(1, f.qty + d); $('#q').textContent = f.qty; };
A.set = (k, v) => { S.form[k] = v; render(); };
A.desc = v => { S.form.desc = v; };
A.ftype = v => { S.form.ftype = v; updateForm(); };
A.cooked = v => { if (!v) return; S.form.cookedAt = timeToMs(v); updateForm(); };
A.photo = input => { const file = input.files && input.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { S.form.photo = r.result; render(); }; r.readAsDataURL(file); };
function updateForm() { const b = $('#safeBox'); if (b) b.innerHTML = safeInner(S.form); renderBar(); tick(); }
A.post = () => {
  const f = S.form, P = DONORS[S.persona], c = CATS[f.cat], food = f.cat === 'food';
  if (food && f.cookedAt + FOODS[f.ftype]*HR <= now()) { toast('This food is past its safe window'); return; }
  const title = food ? `${f.qty} ${f.ftype.toLowerCase()} meals` : f.cat === 'shoes' ? `${f.qty} pair${f.qty > 1 ? 's' : ''} of shoes` : `${f.qty} ${c.label.toLowerCase()}`;
  const d = {id:'d' + (S.nextId++), cat:f.cat, donor:P.name, area:P.area, km:food ? 1.8 : 2.4, qty:f.qty, unit:c.unit, title, desc:f.desc || (food ? 'Packed and ready for handover.' : 'Ready for pickup.'), status:'posted', created:now(), photo:f.photo};
  if (food) Object.assign(d, {ftype:f.ftype, cookedAt:f.cookedAt, safeUntil:f.cookedAt + FOODS[f.ftype]*HR}); else Object.assign(d, {cond:f.cond, pickup:f.pickup});
  S.donations.unshift(d); S.form = null; S.hist = [];
  toast(`Posted. ${NGOS.filter(n => accepts(n, f.cat)).length} NGOs that accept ${c.label.toLowerCase()} were notified.`);
  S.screen = 'dtl'; S.p = {id:d.id}; render(); window.scrollTo(0, 0);
};
/* NGO */
A.feedTab = k => { S.feedTab = k; render(); };
A.openClaim = id => { const d = find(id); if (!d || d.status !== 'posted') { toast('Already claimed by another NGO'); render(); return; } S.claimEnd = d.cat === 'food' ? now() + 10*MIN : 0; A.go('claim', {id, method:d.cat === 'food' ? 'volunteer' : 'collect'}); };
A.method = m => { S.p.method = m; render(); };
A.confirmClaim = () => {
  const d = find(S.p.id);
  if (!d || d.status !== 'posted') { toast('Already claimed by another NGO'); A.back(); return; }
  d.status = 'claimed'; d.ngo = 'Asha Shelter'; d.method = S.p.method; d.claimedAt = now(); S.claimEnd = 0; S.hist = [];
  toast(d.method === 'volunteer' ? 'Claimed. Nearby volunteers were pinged.' : 'Claimed. Pickup is on you now.');
  S.screen = 'active'; S.p = {}; render(); window.scrollTo(0, 0);
};
A.release = auto => { S.claimEnd = 0; toast(auto === true ? 'Reservation expired. Released to the next NGO.' : 'Released to the next NGO.'); A.back(); };
A.picked = id => { const d = find(id); d.status = 'pickup'; d.pickedAt = now(); toast('Marked as picked up.'); render(); };
A.proof = (id, input) => { const file = input.files && input.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { S.proof[id] = r.result; render(); }; r.readAsDataURL(file); };
A.receive = id => {
  const d = find(id); if (!d || d.status === 'received') return;
  d.status = 'received'; d.receivedAt = now(); d.proof = S.proof[id] || null;
  S.impact.given += d.qty; if (d.cat === 'food') S.impact.hot += d.qty; S.impact.week[(new Date().getDay() + 6) % 7] += d.qty;
  toast(`Handover confirmed. ${d.qty} ${d.unit} added to the impact counter.`); render();
};
A.accept = k => { S.needs.accepts[k] = !S.needs.accepts[k]; render(); };
A.meals = d => { S.needs.meals = Math.max(0, S.needs.meals + d); render(); };
A.setMeals = v => { S.needs.meals = v; render(); };
A.diet = v => { S.needs.diet = v; render(); };
A.urgent = v => { S.needs.urgent = v; render(); };
A.size = n => { const a = S.needs.sizes, i = a.indexOf(n); if (i >= 0) a.splice(i, 1); else { a.push(n); a.sort((x, y) => x - y); } render(); };
A.publishNeeds = () => { toast('Needs published. Donors see them on their radar now.'); };
/* volunteer */
A.chip = (kind, k) => { const s = S.vol[kind]; s.has(k) ? s.delete(k) : s.add(k); render(); };
A.cell = (r, d) => { const s = S.vol.avail, k = r + '-' + d; s.has(k) ? s.delete(k) : s.add(k); render(); };
A.weekends = () => { S.vol.avail = new Set(['0-5', '0-6', '1-5', '1-6']); render(); };
A.radius = r => { S.vol.radius = r; render(); };
A.sort = k => { S.sort = k; render(); };
A.openNgo = id => A.go('ngod', {id});
A.slot = (nid, sid) => { S.slotSel[nid] = sid; render(); };
A.offer = nid => { if (S.offers[nid]) { delete S.offers[nid]; toast('Offer withdrawn.'); } else { S.offers[nid] = S.slotSel[nid] || NGO(nid).slots[0].id; toast('Offer sent to ' + NGO(nid).name + '.'); } render(); };
A.accept2 = id => { const d = find(id); if (!d || d.status !== 'claimed') { toast('Someone else already took this dispatch'); render(); return; } d.status = 'pickup'; d.vol = 'Ravi K.'; d.pickedAt = now(); toast('Accepted. Head to the pickup point.'); render(); };
A.decline = id => { S.declined.add(id); toast('Declined. We will ping the next volunteer.'); render(); };
A.reset = () => { init(); toast('Demo reset.'); render(); window.scrollTo(0, 0); };

/* ============ live ticker ============ */
function tick() {
  const t = now();
  document.querySelectorAll('.rg').forEach(el => {
    const rem = +el.dataset.until - t, tot = +el.dataset.total, arc = el.querySelector('.arc'), x = el.querySelector('.rgt');
    arc.setAttribute('stroke-dasharray', Math.max(0, Math.min(100, rem/tot*100)) + ' 100');
    arc.setAttribute('class', 'arc ' + (rem < 15*MIN ? 'stroke-ter' : rem < 60*MIN ? 'stroke-sec' : 'stroke-primary'));
    x.textContent = fmtShort(rem);
    x.className = 'rgt absolute inset-0 flex items-center justify-center text-[10px] font-extrabold ' + (rem < 15*MIN ? 'text-ter' : '');
  });
  document.querySelectorAll('.cd').forEach(el => { el.textContent = fmtCd(+el.dataset.until - t); });
  if (S.screen === 'claim' && S.claimEnd) {
    const l = S.claimEnd - t;
    if (l <= 0) { A.release(true); return; }
    document.querySelectorAll('.ct').forEach(e => { e.textContent = pad(Math.floor(l/60000)) + ':' + pad(Math.floor(l % 60000 / 1000)); });
  }
}

init(); render();
setInterval(tick, 1000);
setInterval(() => { if (S.screen === 'feed' || S.screen === 'dispatch') render(); }, 30000);
</script>
</body>
</html>
